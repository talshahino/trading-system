name: Opposite trades study (one bot)

# Opposite trades on the same instrument inside one bot (user, 16.11.2026, bot 3 gold) - agents/conflict_study.py:
# one machine per instrument with 2+ strategies, then the comparison of the ways (as today / skip / stronger / half /
# closer targets) on the whole bot. Results only - nothing in the bot changes.

on:
  workflow_dispatch:
    inputs:
      bot:
        description: "bot"
        default: "bot3"
      minutes:
        description: "minutes per instrument"
        default: "110"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      syms: ${{ steps.p.outputs.syms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - id: p
        run: echo "syms=$(python -m agents.conflict_study plan --bot ${{ inputs.bot }})" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sym: ${{ fromJson(needs.plan.outputs.syms) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-
      - name: Run
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -u -m agents.conflict_study run --bot ${{ inputs.bot }} --sym "${{ matrix.sym }}" --minutes ${{ inputs.minutes }} 2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-${{ matrix.sym }}
          path: reports/agents/${{ inputs.bot }}/conflict
          if-no-files-found: ignore
          retention-days: 5
  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: cf-*
      - name: Report
        run: |
          mkdir -p reports/agents/${{ inputs.bot }}/conflict
          for d in parts/*/; do cp -r "$d." reports/agents/${{ inputs.bot }}/conflict/; done
          python -m agents.conflict_study report --bot ${{ inputs.bot }} | head -120
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/${{ inputs.bot }}/conflict || true
          git commit -qm "Opposite trades study ${{ inputs.bot }} (agents/conflict_study)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
