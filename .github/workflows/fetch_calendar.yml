name: Fetch FTMO calendar page
on:
  workflow_dispatch:
    inputs:
      date_from:
        default: "2026-11-02"
      date_to:
        default: "2026-11-15"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render page and capture calendar data
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p data/ftmo_calendar
          python - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          out = pathlib.Path("data/ftmo_calendar"); caught = []
          url = "https://ftmo.com/en/calendar/?dateFrom=${{ inputs.date_from }}&dateTo=${{ inputs.date_to }}&restriction=true"
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              def on_resp(r):
                  ct = r.headers.get("content-type", "")
                  if "json" in ct:
                      try:
                          caught.append({"url": r.url, "status": r.status, "body": r.json()})
                      except Exception:
                          pass
              pg.on("response", on_resp)
              pg.goto(url, wait_until="networkidle", timeout=90000)
              pg.wait_for_timeout(8000)
              (out / "rendered.html").write_text(pg.content(), encoding="utf-8")
              (out / "text.txt").write_text(pg.inner_text("body"), encoding="utf-8")
              b.close()
          (out / "responses.json").write_text(json.dumps(caught, ensure_ascii=False, indent=1), encoding="utf-8")
          print(len(caught), [c["url"] for c in caught])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ftmo_calendar
          git commit -m "FTMO calendar snapshot" || true
          git pull --rebase && git push
