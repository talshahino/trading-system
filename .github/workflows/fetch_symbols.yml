name: Fetch FTMO symbols page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render page and capture symbol data
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p data/ftmo_symbols
          curl -sSL -o data/ftmo_symbols/symbols-table.js https://ftmo.com/app/themes/ftmo-com/build/js/symbols-table-Dkxn7OmE.js || true
          python - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          out = pathlib.Path("data/ftmo_symbols"); caught = []
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              def on_resp(r):
                  ct = r.headers.get("content-type", "")
                  if "json" in ct and "ftmo" in r.url:
                      try:
                          caught.append({"url": r.url, "body": r.json()})
                      except Exception:
                          pass
              pg.on("response", on_resp)
              pg.goto("https://ftmo.com/en/symbols/", wait_until="networkidle", timeout=90000)
              pg.wait_for_timeout(5000)
              (out / "rendered.html").write_text(pg.content(), encoding="utf-8")
              b.close()
          (out / "responses.json").write_text(json.dumps(caught, ensure_ascii=False, indent=1), encoding="utf-8")
          print(len(caught), [c["url"] for c in caught])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ftmo_symbols
          git commit -m "FTMO symbols data snapshot" || true
          git pull --rebase && git push
