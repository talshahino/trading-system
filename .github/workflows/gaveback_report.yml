name: Gave-back study - partial exits in every market, from a chop_study run

# agents/gaveback_study.py report on the data of an earlier chop_study run (its artifacts, kept 5 days): break-even /
# partial exits / stepped locking in every market, per strategy and whole bot (user, 16.11.2026, tasks tal1611gaveback, tal1611partial). Results only.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "chop_study run id"
        required: true
      bot:
        description: "bots"
        default: "bot1,bot2,bot3,bot4,bot5"

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: ch-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report
        run: |
          rm -rf reports/agents/*/conflict
          for d in parts/*/; do cp -r "$d." reports/agents/; done
          python -m agents.gaveback_study report --bot '${{ inputs.bot }}' | head -60
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/gaveback_study.json
          git commit -qm "Gave-back study (agents/gaveback_study)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
