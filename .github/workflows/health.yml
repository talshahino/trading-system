name: Bots health

# The cheap layer of every bot agent (user, 11.11.2026 "תשתית לכל"): every 3 hours each bot's live trades are
# compared with its backtest (agents/health.py), the findings go to the manager as cards, and the manager
# re-judges everything (agent_manager.py). No backtests here - about a minute. Moves to the bots' computer
# (every few minutes) once the computer runs the agents.

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  pc:
    # the bots' computer runs the agents now (live/agents_host.py): skip while it is active, take over if it stops
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reports/agents
      - id: c
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as d
          ev = "${{ github.event_name }}"
          try:
              h = json.load(open("reports/agents/host.json"))
              t = d.datetime.fromisoformat(h.get("updated") or "1970-01-01T00:00:00+00:00")
              age = (d.datetime.now(d.timezone.utc) - t).total_seconds() / 3600
          except Exception:
              age = 999
          print("run=" + ("true" if ev == "workflow_dispatch" or age > 4 else "false"))
          PY
  health:
    needs: pc
    if: needs.pc.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Health of every bot
        run: python -u -m agents.health
      - name: Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u agent_manager.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/*/health.json reports/agents/*/cards_health.json reports/agents/manager.json
          git commit -qm "Bots health" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
