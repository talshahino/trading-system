name: News ticks study (bot 7)

# Entering a release within seconds on Dukascopy's ticks, only the hours around the releases (user, 17.11.2026) - agents/news_ticks.py.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - id: p
        run: echo "jobs=$(python -m agents.news_ticks plan)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-
      - name: Restore ticks cache
        uses: actions/cache/restore@v4
        with:
          path: cache/duka_ticks
          key: duka-ticks-${{ matrix.job }}-${{ github.run_id }}
          restore-keys: duka-ticks-${{ matrix.job }}-
      - name: Run
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set -o pipefail
          python -u -m agents.news_ticks run --sym "${{ matrix.job }}" 2>&1 | tail -40
      - name: Save ticks cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/duka_ticks
          key: duka-ticks-${{ matrix.job }}-${{ github.run_id }}
      - name: Name
        if: always()
        id: n
        run: echo "n=$(echo '${{ matrix.job }}' | tr ':/' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nt-${{ steps.n.outputs.n }}
          path: reports/agents/bot7/news_ticks
          if-no-files-found: ignore
          retention-days: 5
  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: nt-*
      - name: Report
        run: |
          mkdir -p reports/agents/bot7/news_ticks
          for d in parts/*/; do cp -r "$d." reports/agents/bot7/news_ticks/; done
          python -m agents.news_ticks report | head -80
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/bot7/news_ticks || true
          git commit -qm "News ticks study bot 7 (agents/news_ticks)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
