name: Portfolio search + Prophet check
on:
  workflow_dispatch:
    inputs:
      trades:
        description: "Glob of combo trade files"
        default: "reports/*/combo_trades_*.csv.gz"
      n:
        description: "How many portfolios"
        default: "3"
permissions:
  contents: write
concurrency:
  group: portfolio
  cancel-in-progress: false
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-
      - name: Search and verify
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python -u portfolio_search.py --trades "${{ inputs.trades }}" --out output/portfolios.json --n "${{ inputs.n }}" | tee output/search.log
          python -u verify_portfolio.py --trades "${{ inputs.trades }}" --portfolios output/portfolios.json --end "$(date -u -d yesterday +%F)"
      - name: Commit
        if: always()
        run: |
          DIR="reports/$(date -u +%F)_portfolio_run${{ github.run_number }}"
          mkdir -p "$DIR"
          cp output/report_portfolios.html output/portfolios.json output/search.log "$DIR"/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Portfolio report run ${{ github.run_number }}" || true
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep 15; done
