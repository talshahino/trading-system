name: TradingView strategies backtest

# Runs the rule-based strategies collected from TradingView (agents/rules_agent.py) on GitHub's servers. Start it by hand from the Actions tab
# ("Run workflow"); nothing runs automatically.
# Keys come from the repository's Actions secrets and never appear in the code or logs:
#   ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Synthetic data only (no keys needed, ~1 minute) - use to check the setup"
        type: boolean
        default: false
      market:
        description: "forex = currency pairs + gold/silver/oil; stocks = ETFs, stocks, crypto"
        type: choice
        options: [ftmo, forex]
        default: ftmo
      start:
        description: "Start date (YYYY-MM-DD). Alpaca price history starts in 2016"
        default: "2016-01-01"
      end:
        description: "End date (YYYY-MM-DD). Empty = yesterday"
        default: ""
      timeframes:
        description: "Comma separated subset of 1Min,5Min,15Min,1Hour,4Hour. Empty = all"
        default: ""
      only:
        description: "Comma separated strategy ids. Empty = all"
        default: ""
      symbols:
        description: "Comma separated instruments subset. Empty = all"
        default: ""
      combos_file:
        description: "Repo path of a sid|timeframe|symbol list: run only these, save their trades"
        default: ""
      test_from:
        description: "Judge every combo directly from this date (YYYY-MM-DD), no selection period. Empty = old split"
        default: ""

permissions:
  contents: write   # to save the reports back into the repository

concurrency:
  group: backtest-${{ inputs.timeframes }}-${{ inputs.symbols }}-${{ inputs.only }}-${{ inputs.combos_file }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Downloaded news, prices and Claude classifications are kept between runs,
      # so a second run is fast and never pays Claude twice for the same headline.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-

      # Download first and save the cache right away, so a later crash never loses the
      # (slow) price downloads.
      - name: Download price data
        if: ${{ !inputs.demo }}
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          MAX_RUN_MINUTES: "200"
        run: |
          END="${{ inputs.end }}"
          if [ -z "$END" ]; then END=$(date -u -d "yesterday" +%F); fi
          python -u run_poc.py --download-only --market "${{ inputs.market }}" --start "${{ inputs.start }}" --end "$END"

      - name: Save price data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}-dl

      - name: Run backtest
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          MAX_RUN_MINUTES: "320"   # stop cleanly before GitHub's limit so the cache is saved
        run: |
          END="${{ inputs.end }}"
          if [ -z "$END" ]; then END=$(date -u -d "yesterday" +%F); fi
          echo "END_DATE=$END" >> "$GITHUB_ENV"

          # Live progress: every 3 minutes the last lines of the log are pushed to the
          # 'progress' branch (log only - keys are never printed), so progress can be
          # checked without opening the Actions page.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/progress >/dev/null 2>&1
          ( cd /tmp/progress && git checkout -q --orphan progress && git rm -rq --cached . && \
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + ) || true
          touch run.log
          (
            while true; do
              sleep 180
              { echo "run ${{ github.run_number }} - updated $(date -u '+%F %T') UTC"; echo; \
                tail -n 150 run.log | tr '\r' '\n' | tail -n 150; } > /tmp/progress/log.txt
              ( cd /tmp/progress && git add log.txt && git commit -qm "progress run ${{ github.run_number }}" \
                && git push -qf origin HEAD:progress ) >/dev/null 2>&1 || true
            done
          ) &

          set -o pipefail
          if [ "${{ inputs.demo }}" = "true" ]; then
            python -u run_rules.py --demo 2>&1 | tee run.log
          else
            python -u run_rules.py --market "${{ inputs.market }}" --export "TV01:4Hour,TV02:4Hour,TV04:4Hour,TV09:1Hour,TV09:4Hour" --start "${{ inputs.start }}" --end "$END" --timeframes "${{ inputs.timeframes }}" --test-from "${{ inputs.test_from }}" --symbols "${{ inputs.symbols }}" --only "${{ inputs.only }}" --combos-file "${{ inputs.combos_file }}" 2>&1 | tee run.log
          fi

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: output/
          if-no-files-found: warn

      # Reports (HTML only, no data, no keys) are committed to reports/<date>_<run>/
      # so every run stays in the repository's history.
      - name: Commit reports
        if: success() && hashFiles('output/report_*.html') != ''
        run: |
          DIR="reports/$(date -u +%F)_tv_run${{ github.run_number }}${{ inputs.demo && '_demo' || '' }}"
          mkdir -p "$DIR"
          cp output/report_*.html "$DIR"/
          cp output/trades_*.csv "$DIR"/ 2>/dev/null || true
          cp output/combo_trades_*.csv.gz "$DIR"/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "TradingView strategies report: ${{ inputs.start }} to ${END_DATE}${{ inputs.demo && ' (demo)' || '' }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && break; sleep $((RANDOM % 30 + 10)); done
