name: Shocks (bot 7)

# Shocks without a calendar release: detection, the 30-day log and the strategy study (agents/shocks.py).
# Normally runs on the bots' computer (live/agents_host.py); this is the fallback / first run.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes for the shocks scan / SH01 fix grid"
        default: "120"
      regime_minutes:
        description: "Minutes for the regime-filter study (agents/news_regime.py, fix attempts EV03 / SH01 GER40); 0 = skip"
        default: "80"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-
      - name: Run
        run: |
          git fetch -q origin +refs/heads/live:refs/remotes/origin/live || true
          python -u agents/shocks.py --minutes ${{ inputs.minutes || '120' }} 2>&1 | tee shocks.log
          # bot 7's regime-filter fix attempts (14.11.2026: the bots' computer's agents stalled from 14:18 UTC)
          if [ "${{ inputs.regime_minutes || '80' }}" != "0" ]; then
            python -u -m agents.news_regime --minutes ${{ inputs.regime_minutes || '80' }} --force 2>&1 | tee regime.log || true
          fi
      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp shocks.log reports/agents/bot7/shocks.log
          cp regime.log reports/agents/bot7/regime.log 2>/dev/null || true
          # sh01_fix.json / regime_study.json: the fix attempts' results (left out before 14.11.2026 - only in the log)
          git add data/agents/shocks_scan.json reports/agents/bot7/shocks_study.json reports/agents/bot7/shocks.log
          for f in reports/agents/bot7/sh01_fix.json reports/agents/bot7/regime_study.json reports/agents/bot7/regime.log; do [ -f "$f" ] && git add "$f"; done; true
          git commit -qm "Bot 7: shocks scan and study" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; done
