name: Snapshot a web page (design reference)
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p snap
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url = "${{ inputs.url }}"
          with sync_playwright() as p:
              b = p.chromium.launch()
              for name, vp in (("desktop", {"width": 1440, "height": 900}), ("phone", {"width": 390, "height": 844})):
                  pg = b.new_page(viewport=vp, device_scale_factor=2 if name == "phone" else 1)
                  pg.goto(url, wait_until="networkidle", timeout=90000)
                  pg.wait_for_timeout(6000)
                  pg.screenshot(path=f"snap/{name}.png", full_page=True)
                  if name == "desktop":
                      open("snap/page.html", "w").write(pg.content())
                      css = pg.evaluate("""() => [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join('\\n') } catch(e) { return '/* ' + s.href + ' */' } }).join('\\n')""")
                      open("snap/styles.css", "w").write(css)
              b.close()
          PY
      - name: Print (base64, for download through the log)
        run: |
          pip install -q pillow
          python - <<'PY'
          import base64, io
          from PIL import Image
          for n in ("desktop", "phone"):
              im = Image.open(f"snap/{n}.png").convert("RGB")
              w = 1000 if n == "desktop" else 600
              im = im.resize((w, int(im.height * w / im.width)))
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=70)
              print(f"=====BEGIN {n}.jpg"); print(base64.b64encode(buf.getvalue()).decode()); print(f"=====END {n}.jpg")
          for n in ("styles.css",):
              print(f"=====BEGIN {n}"); print(base64.b64encode(open(f"snap/{n}", "rb").read()).decode()); print(f"=====END {n}")
          PY
