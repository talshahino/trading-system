name: Structural stop study (bot 5, task b5stop1611)

# The stop beyond the 2nd / 3rd swing on SC077 US30 and SC326 (user, 16.11.2026) - agents/stop_study.py swing. Results only.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes per instrument"
        default: "110"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - id: p
        run: echo "jobs=$(python -m agents.stop_study plan_swing)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJson(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: poc-cache-${{ github.run_id }}
          restore-keys: poc-cache-
      - name: Run
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -u -m agents.stop_study run_swing --sym "${{ matrix.job }}" --minutes ${{ inputs.minutes || '110' }} 2>&1 | tail -30
      - name: Name
        id: n
        run: echo "n=$(echo '${{ matrix.job }}' | tr ':/' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-${{ steps.n.outputs.n }}
          path: reports/agents/bot5/stop_study/swing
          if-no-files-found: ignore
          retention-days: 5
  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: sw-*
      - name: Report
        run: |
          mkdir -p reports/agents/bot5/stop_study/swing
          for d in parts/*/; do cp -r "$d." reports/agents/bot5/stop_study/swing/; done
          python -m agents.stop_study report_swing | head -60
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/bot5/stop_study/swing || true
          git commit -qm "Structural stop study bot 5 (agents/stop_study swing)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
