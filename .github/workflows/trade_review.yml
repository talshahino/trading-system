name: Live trade review

# Every morning at 08:00 Israel time (user, 05.11.2026; no notifications): every closed trade of every bot account (state files on branch `live`) gets its
# what-ifs (target at 1 / 1.5 / 2 / 3 R, a nearer stop), accumulated per strategy next to the strategy's
# backtest, and the strategy review of "ניהול בוטים" (risk_review.py -> risk.json). Read-only for the bots.

on:
  schedule:
    # every morning 08:00 Israel time (06:00 UTC in winter, 05:00 in summer; GitHub may start it a little late)
    - cron: "0 5,6,7,9,12,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trade-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Once a day from 08:00 Israel time
        id: gate
        run: |
          # GitHub starts scheduled runs late (or early) at random: a scheduled run goes ahead from 08:00 Israel time on,
          # once a day - only if today's recommendations are not published yet
          h=$(TZ=Asia/Jerusalem date +%H); today=$(TZ=Asia/Jerusalem date +%F)
          done_=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/main/reports/trade_review/risk.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sample',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          # (12.11.2026: GitHub started the 05-07 UTC runs at 14:00-17:00 Israel time, so 09-11.11 were never published -
          # any hour from 08:00 to 23:00 counts now, still once a day)
          elif [ "$h" -ge 8 ] && [ "$h" -le 23 ] && [ "$done_" != "$today" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "skip: $h:00 in Israel, published sample $done_"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install pandas numpy pywebpush
      - name: Review
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p /tmp/states
          for f in $(git ls-tree --name-only origin/live live/ | grep '_state.json$'); do
            git show "origin/live:$f" > "/tmp/states/$(basename "$f")"
          done
          python -u trade_review.py --states /tmp/states
      - name: Risk per strategy (recommendations for the app; nothing changes without the user's approval)
        if: steps.gate.outputs.go == 'true'
        run: |
          git show origin/live:live/manager_state.json > /tmp/manager_state.json || echo '{}' > /tmp/manager_state.json
          python -u risk_review.py --states /tmp/states --manager /tmp/manager_state.json
      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/trade_review
          git commit -m "Live trade review $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep 15; done
