name: US actuals (bot 7)

# The actuals FTMO's calendar history lacks for NFP / CPI / the Fed's rate / advance GDP (user, 17.11.2026) -
# agents/us_actuals.py (ALFRED: as first published). Writes reports/agents/bot7/calendar_full.json.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe
        run: |
          for u in "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=PAYEMS&vintage_date=2025-06-06" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=PAYEMS" "https://api.bls.gov/publicAPI/v1/timeseries/data/CES0000000001" "https://www.bls.gov/news.release/empsit.nr0.htm" "https://download.bls.gov/pub/time.series/ce/ce.data.0.AllCESSeries" "https://www.forexfactory.com/calendar?month=jun.2025" "https://nfs.faireconomy.media/ff_calendar_thisweek.json"; do
            echo "$u -> $(curl --http1.1 -m 20 -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' -o /tmp/p.out -w '%{http_code} %{size_download}' "$u" 2>&1 || true)"; head -c 300 /tmp/p.out 2>/dev/null || true; echo; done
      - name: Run
        if: false
        timeout-minutes: 20
        run: python -u -m agents.us_actuals
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agents/bot7/calendar_full.json || true
          git commit -qm "Bot 7: the US actuals (NFP / CPI / Fed / GDP) from ALFRED (agents/us_actuals)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
