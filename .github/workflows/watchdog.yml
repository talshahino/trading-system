name: Bot watchdog
# Every 15 minutes (GitHub may run it later): if a bot that reported before has been silent for 20+ minutes,
# send a phone alert (ntfy topic in live/notify.json), at most once an hour per bot while it stays silent.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: live/notify.json
      - uses: actions/cache/restore@v4
        with:
          path: watchdog
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-
      - name: Check bot heartbeats
        run: |
          mkdir -p watchdog
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          topic = json.load(open("live/notify.json"))["topic"]
          now = dt.datetime.now(dt.timezone.utc)
          memo_f = "watchdog/last_alert.json"
          memo = json.load(open(memo_f)) if os.path.exists(memo_f) else {}
          names = {"bot1": "בוט 1", "bot2": "בוט 2", "bot3": "בוט 3"}
          for b, he in names.items():
              try:
                  s = json.load(urllib.request.urlopen(f"https://raw.githubusercontent.com/talshahino/trading-system/live/live/{b}_state.json?t={now.timestamp()}", timeout=20))
              except Exception:
                  continue                      # this bot never reported: nothing to watch
              age = (now - dt.datetime.fromisoformat(s["updated_utc"])).total_seconds() / 60
              print(b, "age", round(age), "min")
              if age < 20 or age > 7 * 24 * 60:
                  memo.pop(b, None)
                  continue
              last = memo.get(b)
              if last and (now - dt.datetime.fromisoformat(last)).total_seconds() < 3600:
                  continue
              memo[b] = now.isoformat()
              t = f"{round(age)} דקות" if age < 120 else f"{age / 60:.1f} שעות"
              msg = (f"{he} לא דיווח כבר {t}. בדוק שהמחשב דלוק ולא במצב שינה, ש־MT5 פתוח, ושהחלון השחור של הבוט פתוח "
                     f"(אם בכותרת החלון כתוב Select, לחץ Esc).")
              body = json.dumps({"topic": topic, "title": f"{he} לא מגיב", "message": msg, "priority": 5, "tags": ["rotating_light"]}).encode()
              urllib.request.urlopen(urllib.request.Request("https://ntfy.sh/", data=body, method="POST",
                                                            headers={"Content-Type": "application/json"}), timeout=20)
              print("alert sent", b)
          json.dump(memo, open(memo_f, "w"))
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: watchdog
          key: watchdog-${{ github.run_id }}
